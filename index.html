<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KLP Solnavägen 4 - SVG 3D Lines</title>
    <meta
      name="description"
      content="A-Frame scene with clean 3D lines created from SVG files" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />

    <!-- A-Frame + Bloom -->
    <script src="assets/aframe-master.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <!-- Post-processing for bloom effects -->
    <script src="https://cdn.jsdelivr.net/gh/supereggbert/aframe-htmlembed-component@master/dist/0.2.0/aframe-htmlembed-component.min.js"></script>

    <!-- External CSS & JS -->
    <link
      rel="stylesheet"
      href="styles.css" />
    <script
      src="js/main.js"
      defer></script>
  </head>
  <body>
    <!-- tabindex="0" allows the scene to capture keyboard events -->
    <a-scene
      tabindex="0"
      focal-changer
      background="color: #1a1a1a"
      fog="type: linear; color: #2a2a2a; near: 15; far: 40"
      shadow="type: pcfsoft; renderOnTop: false"
      renderer="shadowMapEnabled: true; shadowMapType: pcfsoft"
      bloom-effect="intensity: 5.8; threshold: 0.7; radius: 0.5">
      <!-- Enhanced ambient lighting for better global illumination 
      <a-light
        type="ambient"
        color="#505050"
        intensity="0.4"></a-light>-->

      <!-- Enhanced directional light for better shadows and illumination 
      <a-light
        type="directional"
        color="#ffffff"
        intensity="0.6"
        position="5 10 5"
        cast-shadow="true"></a-light>-->

      <!-- Atmospheric lighting for better global illumination -->
      <a-light
        type="point"
        color="#ffaa44"
        position="3 2 3"
        intensity="0.8"
        distance="15"
        decay="2"></a-light>

      <a-light
        type="point"
        color="#4488ff"
        position="-3 2 -3"
        intensity="0.6"
        distance="12"
        decay="2"></a-light>

      <!-- Assets -->
      <a-assets>
        <a-asset-item
          id="modelGLB"
          src="assets/solnavägen4v6.glb"></a-asset-item>

        <!-- SVG Assets for 3D lines -->
        <a-asset-item
          id="svg1"
          src="assets/1.svg"></a-asset-item>
        <a-asset-item
          id="svg2"
          src="assets/2.svg"></a-asset-item>
        <a-asset-item
          id="svg3"
          src="assets/3.svg"></a-asset-item>
        <a-asset-item
          id="svg4"
          src="assets/4.svg"></a-asset-item>
      </a-assets>

      <!-- HDRI Environment for realistic lighting and reflections
      <a-sky
        id="hdri-sky"
        src="assets/pond_bridge_night_4k.exr"
        radius="50"></a-sky> -->

      <!-- GLB Model with enhanced materials -->
      <a-entity
        gltf-model="#modelGLB"
        glb-material-enhancer="envMapIntensity: 1.5; forceTransparency: false; transparencyOpacity: 0.3; transparencyPattern: GLASS"
        position="8 -2.7 -5"
        rotation="0 90 0"
        scale="0.001 0.001 0.001"
        shadow="cast: true; receive: true"></a-entity>

      <!-- Podium Cube under SVG group -->
      <a-box
        id="svg-podium"
        position="1.75 0.6 -2.85"
        width="1.4"
        height="0.5"
        depth="1"
        color="#2a2a2a"
        roughness="0.8"
        metalness="0.1"
        shadow="cast: true; receive: true"></a-box>

      <!-- SVG File Loading Group - Clean 3D lines from your SVG files -->
      <a-entity
        id="svg-files-group"
        position="1.75 1.56 -2.4"
        rotation="0 0 180"
        scale="0.3 0.3 0.3">
        <!-- Panel 1: SVG File 1 -->
        <a-entity position="0 0 0">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-1a"
            rect-area-light="color: #ffffff; intensity: 0.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-1b"
            rect-area-light="color: #ffffff; intensity: 1.5; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg1; lineThickness: 0.02; color: #ffffff; emissive: #ffffff; emissiveIntensity: 0.8; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg1; lineThickness: 0.025; useSvgColor: true; emissiveIntensity: 0.6"
            simple-glow="intensity: 1.8"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 2: SVG File 2 -->
        <a-entity position="0 0 -1">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-2a"
            rect-area-light="color: #ffffff; intensity: 0.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-2b"
            rect-area-light="color: #ffffff; intensity: 1.5; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg2; lineThickness: 0.02; color: #ffffff; emissive: #ffffff; emissiveIntensity: 0.8; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg2; lineThickness: 0.025; useSvgColor: true; emissiveIntensity: 0.6"
            simple-glow="intensity: 1.8"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 3: SVG File 3 -->
        <a-entity position="0 0 -2">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-3a"
            rect-area-light="color: #ffffff; intensity: 0.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-3b"
            rect-area-light="color: #ffffff; intensity: 1.5; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg3; lineThickness: 0.02; color: #ffffff; emissive: #ffffff; emissiveIntensity: 0.8; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg3; lineThickness: 0.025; useSvgColor: true; emissiveIntensity: 0.6"
            simple-glow="intensity: 1.8"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 4: SVG File 4 -->
        <a-entity position="0 0 -3">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-4a"
            rect-area-light="color: #ffffff; intensity: 0.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-4b"
            rect-area-light="color: #ffffff; intensity: 1.5; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg4; lineThickness: 0.02; color: #ffffff; emissive: #ffffff; emissiveIntensity: 0.8; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg4; lineThickness: 0.025; useSvgColor: true; emissiveIntensity: 0.6"
            simple-glow="intensity: 1.8"
            position="0 0 0.008"></a-entity>
        </a-entity>
      </a-entity>

      <!-- Camera with A-Frame Extras controls -->
      <a-entity
        id="cameraRig"
        position="0 1.6 3"
        movement-controls="controls: keyboard; speed: 0.05; fly: true">
        <a-entity
          id="camera"
          camera="active: true"
          look-controls="pointerLockEnabled: true"
          always-look-at="#svg-files-group"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
