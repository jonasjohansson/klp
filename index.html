<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KLP</title>
    <!-- Prevent favicon 404 error -->
    <link
      rel="icon"
      href="data:," />
    <meta
      name="description"
      content="A-Frame scene with clean 3D lines created from SVG files" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />

    <!-- Import Maps for ES6 Modules (using local files) -->
    <script type="importmap">
      {
        "imports": {
          "aframe": "./assets/libraries/aframe/aframe-master.module.min.js",
          "three": "./assets/libraries/three/three.module.min.js",
          "three/addons/": "./assets/three-addons/"
        }
      }
    </script>

    <!-- Load A-Frame as ES6 module -->
    <script type="module">
      import AFRAME from "aframe";
      import * as THREE from "three";
    </script>

    <script
      src="./js/components/lighting/bloom.js"
      type="module"></script>

    <!-- External CSS & JS -->
    <link
      rel="stylesheet"
      href="css/styles.css" />
    <script
      src="js/main.js"
      type="module"
      defer></script>
  </head>
  <body>
    <a-scene
      background="color: #000000"
      fog="type: linear; color: #000000; near: 25; far: 60"
      shadow="type: pcfsoft"
      renderer="toneMapping: ACESFilmic;"
      bloom="threshold: 0.5; strength: 0.4; radius: 1.2"
      svg-color-lighting="svgFiles: #svg1, #svg2, #svg3, #svg4; atmosphericLightId: atmospheric-light"
      inspector="enabled: true"
      loading-screen="enabled: false"
      xr-mode-ui="enabled: false">
      <!-- Atmospheric lighting for better global illumination  -->

      <a-light
        id="atmospheric-light"
        type="point"
        color="#4488ff"
        position="-3 2 -3"
        intensity="4"
        distance="10"
        decay="1"></a-light>

      <!-- Assets -->
      <a-assets>
        <a-asset-item
          id="modelGLB"
          src="assets/models/klp.glb"></a-asset-item>

        <!-- SVG Assets for 3D lines -->
        <a-asset-item
          id="svg1"
          src="assets/graphics/11.svg"></a-asset-item>
        <a-asset-item
          id="svg2"
          src="assets/graphics/22.svg"></a-asset-item>
        <a-asset-item
          id="svg3"
          src="assets/graphics/33.svg"></a-asset-item>
        <a-asset-item
          id="svg4"
          src="assets/graphics/44.svg"></a-asset-item>
      </a-assets>

      <!-- GLB Model with enhanced materials -->
      <a-entity
        gltf-model="#modelGLB"
        glb-material-enhancer="envMapIntensity: 4; forceTransparency: false; transparencyOpacity: 0.3; transparencyPattern: GLASS"
        position="8 -2.7 -5"
        rotation="0 90 0"
        scale="0.001 0.001 0.001"
        shadow="cast: true; receive: true"></a-entity>

      <!-- Podium Cube under SVG group -->
      <a-box
        id="svg-podium"
        position="1.75 0.6 -2.85"
        width="1.4"
        height="0.5"
        depth="1"
        color="#2a2a2a"
        roughness="0.8"
        metalness="0.1"
        shadow="cast: true; receive: true"></a-box>

      <!-- SVG File Loading Group - Clean 3D lines from your SVG files -->
      <a-entity
        id="svg-files-group"
        position="1.75 1.56 -2.4"
        rotation="0 0 180"
        scale="0.3 0.3 0.3">
        <!-- Panel 1: SVG File 1 -->
        <a-entity position="0 0 0">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-1a"
            rect-area-light="intensity: 2.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-1b"
            rect-area-light="intensity: 4; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg1; lineThickness: 0.02; emissive: #ffffff; emissiveIntensity: 0.9; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg1; lineThickness: 0.04; useSvgColor: true; emissiveIntensity: 1.2"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 2: SVG File 2 -->
        <a-entity position="0 0 -1">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-2a"
            rect-area-light="intensity: 2.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-2b"
            rect-area-light="intensity: 4; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg2; lineThickness: 0.02; emissive: #ffffff; emissiveIntensity: 0.9; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg2; lineThickness: 0.04; useSvgColor: true; emissiveIntensity: 1.2"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 3: SVG File 3 -->
        <a-entity position="0 0 -2">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-3a"
            rect-area-light="intensity: 2.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-3b"
            rect-area-light="intensity: 4; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg3; lineThickness: 0.02; emissive: #ffffff; emissiveIntensity: 0.9; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg3; lineThickness: 0.04; useSvgColor: true; emissiveIntensity: 1.2"
            position="0 0 0.008"></a-entity>
        </a-entity>

        <!-- Panel 4: SVG File 4 -->
        <a-entity position="0 0 -3">
          <!-- Sheet lights for this panel -->
          <a-entity
            id="sheet-light-4a"
            rect-area-light="intensity: 2.5; width: 2; height: 2"
            position="0 0 0"></a-entity>
          <a-entity
            id="sheet-light-4b"
            rect-area-light="intensity: 4; width: 2; height: 2"
            position="0 0 0"
            rotation="0 180 0"></a-entity>
          <!-- Acrylic slab plane -->
          <a-entity
            acrylic-plane
            position="0 0 0"></a-entity>
          <!-- White background SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg4; lineThickness: 0.02; emissive: #ffffff; emissiveIntensity: 0.9; useSvgColor: false"
            position="0 0 0.005"></a-entity>
          <!-- Colored foreground SVG -->
          <a-entity
            svg-file-loader="svgFile: #svg4; lineThickness: 0.04; useSvgColor: true; emissiveIntensity: 1.2"
            position="0 0 0.008"></a-entity>
        </a-entity>
      </a-entity>

      <!-- Camera with basic controls -->
      <a-entity
        id="cameraRig"
        position="0.5 1.6 1.5">
        <a-entity
          id="camera"
          camera="active: true"
          wasd-controls="enabled: true; acceleration: 5;"
          always-look-at="#svg-files-group"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
